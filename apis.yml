name: Moviation, Inc.
description: >-
  Moviation, Inc. is a Seoul-based advanced air mobility and premium travel
  company founded in 2022 and backed by 500 Global. It operates Vonaer, an
  AI-powered luxury mobility platform that orchestrates on-demand travel across
  private aviation (jets and helicopters), luxury ground transportation
  (limousines), super yachts, and curated experiences, with planned expansion
  into electric vertical takeoff and landing (eVTOL) urban air mobility (UAM).
  Moviation currently runs air-taxi service with conventional helicopters and
  has partnered with hybrid-eVTOL developer Plana to build out an advanced air
  mobility (AAM) ecosystem in South Korea. The company reaches customers through
  the consumer Vonaer app and a concierge membership program; it publishes no
  public developer API, SDK, or documentation surface at this time.
